name: Build SG Technical APK V2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V2 project
        run: |
          unzip -o SG_Technical_ANDROID_PROJECT_V2.zip
          ls -la SG_Technical_ANDROID_FIXED

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: SG_Technical_ANDROID_FIXED
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SG-Technical-APK-V2
          path: SG_Technical_ANDROID_FIXED/app/build/outputs/apk/debug/*.apk
